name: Experiential Labs
description: Experiential Labs is an applied AI research laboratory (Y Combinator Summer
  2026, San Francisco) building world models that let AI agents simulate reality with
  high fidelity. Founded by Kion Fallah (former staff research scientist at Waabi)
  and Silen Naihin (AutoGPT and agent-benchmark contributor, co-founder of Stackwise),
  the company adapts techniques from autonomous-vehicle development to reconstruct
  environments at high accuracy and pursue recursive self-improvement and continual
  learning across domains. Its public work is open source on GitHub, including the
  world-model-harness (world-model-as-a-harness for simulating AI agent environments),
  OpenCLaaS (Continual Learning as a Service), and autoresearch-distillation. The
  company does not yet publish a public API, developer portal, or SDKs.
